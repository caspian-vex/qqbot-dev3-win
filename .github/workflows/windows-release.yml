name: Windows Release

# 什么时候跑：
#   - 推 tag（v0.10.0 这种）：出安装包并建 Release
#   - 手动触发：只出安装包，留在 Actions 的 Artifacts 里
#   - 改到打包相关文件时跑一次构建（不发布），防止安装包在无人察觉时坏掉
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/win/**'
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  build:
    # 构建脚本要调 makensis 与 System32\tar，只能在 Windows 上跑
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 依赖里没有原生模块，ci 足够；用 install 是为了容错 lock 文件与 package.json 轻微不同步
      - name: 安装依赖
        run: npm ci

      # 四个外部资源加起来 140 MB 左右，node.exe 与 NapCat 在 CI 上是纯重复下载。
      # 缓存键带上版本号：换了 Node/NapCat/WinSW 版本会自然失效。
      - name: 缓存外部资源
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-node22.22.2-napcat4.18.42-winsw2.12.0-nsis3.11

      # 含 typecheck + 全部测试 + esbuild 打包 + staging + makensis
      - name: 构建安装包
        run: npm run setup:win

      - name: 记录产物信息
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-win\*-setup.exe | Select-Object -First 1
          "SIZE_MB={0:N1}" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_ENV
          Get-Content dist-win\SHA256SUMS.txt | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "体积: {0:N1} MB" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: qqbot-setup
          path: |
            dist-win/*-setup.exe
            dist-win/SHA256SUMS.txt
          retention-days: 30

      # ---- 发布（仅 tag 触发）----
      - name: 打包发布说明
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 用数组拼，不用 here-string：YAML 块标量会给每一行加缩进，而 here-string
          # 的终止符 "@ 必须顶格；带缩进时 PowerShell 会把它当字符串内容，整段说明
          # 最后被压成一行（v0.10.0 首次发布就踩了这个）。
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem dist-win\*-setup.exe | Select-Object -First 1
          $size = [math]::Round($exe.Length / 1MB, 1)
          $hash = ((Get-Content dist-win\SHA256SUMS.txt -Raw) -split '\s+')[0]
          $lines = @(
            "qqbot $tag — Windows 安装包",
            "",
            "下载 **$($exe.Name)**（$size MB）。",
            "",
            "## 安装",
            "",
            "1. 下载后右键「以管理员身份运行」。",
            "2. 向导里选安装路径与组件；服务账号 qqbot_svc 由安装包自动创建（低权限、无管理员权限）。",
            "3. 结束页会给出面板地址与初始密码，同时写入 C:\ProgramData\qqbot\logs\credentials.txt。",
            "",
            "## 装完之后",
            "",
            "- 面板：http://127.0.0.1:5666 —— 只监听本机，请在本机或远程桌面里打开。",
            "- 协议端不会自动启动，避免把你正在用的 QQ 顶下线。需要时从开始菜单点「启动协议端」扫码登录。",
            "- 自检：在安装目录执行 tools\verify.mjs，会逐项核对服务、端口、账号权限。",
            "",
            "## 要求",
            "",
            "- Windows 10 / Windows Server 2016 及以上，已安装 QQ NT（协议端依赖它）。",
            "- Windows Server 必须是「桌面体验」版本并保持有人登录：QQ 是图形程序，没有桌面会话起不来。",
            "",
            "## 校验",
            "",
            "SHA256：$hash",
            "",
            "完整内容见 SHA256SUMS.txt；校验命令：certutil -hashfile $($exe.Name) SHA256",
            ""
          )
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.md'), ($lines -join "`n"), (New-Object Text.UTF8Encoding $false))
          Get-Content RELEASE_NOTES.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist-win/*-setup.exe
            dist-win/SHA256SUMS.txt
          fail_on_unmatched_files: true
